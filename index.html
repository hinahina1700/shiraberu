<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しらべる - かくうこっかのけんさくえんじん</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        /* 基本設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* 画面中央・上部の切り替え用コンテナ */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 15vh; /* 初期状態は少し上寄りの中央 */
            transition: padding-top 0.4s ease;
        }

        /* 検索結果が出たあとのスタイル */
        body.has-results .main-wrapper {
            padding-top: 20px;
            align-items: flex-start;
            border-bottom: 1px solid #dadce0;
        }

        .header-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        body.has-results .header-content {
            flex-direction: row;
            max-width: 100%;
            align-items: center;
            gap: 20px;
        }

        /* ロゴ設定 */
        .logo-container {
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .logo-container img {
            width: 200px; /* 初期サイズ */
            height: auto;
            transition: width 0.3s ease;
        }

        body.has-results .logo-container {
            margin-bottom: 0;
        }

        body.has-results .logo-container img {
            width: 120px; /* 検索後のサイズ */
        }

        /* 検索ボックスのコンテナ */
        .search-area {
            width: 100%;
            max-width: 584px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.has-results .search-area {
            max-width: 600px;
            align-items: flex-start;
        }

        .search-input-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #dfe1e5;
            box-shadow: none;
            border-radius: 24px;
            padding: 2px 8px 2px 20px;
            transition: box-shadow 0.2s;
        }

        .search-input-wrapper:hover, .search-input-wrapper:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-box {
            flex: 1;
            height: 44px;
            font-size: 16px;
            border: none;
            outline: none;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 15px;
            color: #1a73e8;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ボタン群（初期状態のみ表示） */
        .home-buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        body.has-results .home-buttons {
            display: none;
        }

        .home-btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            margin: 11px 4px;
            padding: 0 16px;
            line-height: 34px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .home-btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* 検索結果・タブ設定 */
        .results-container {
            width: 100%;
            max-width: 800px;
            margin-left: 160px; /* ロゴの幅に合わせる */
            padding: 0 20px;
            box-sizing: border-box;
            display: none;
        }

        body.has-results .results-container {
            display: block;
        }

        @media (max-width: 900px) {
            body.has-results .results-container {
                margin-left: 0;
            }
            body.has-results .header-content {
                flex-direction: column;
            }
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #70757a;
        }

        .tab {
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #1a73e8;
            border-bottom: 3px solid #1a73e8;
        }

        .meta-info {
            font-size: 14px;
            color: #70757a;
            margin: 15px 0;
        }

        /* 結果カード */
        .card { margin-bottom: 30px; max-width: 650px; }
        .site-label { font-size: 14px; color: #202124; margin-bottom: 4px; }
        .card h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: normal; }
        .card h2 a { color: #1a0dab; text-decoration: none; }
        .card h2 a:hover { text-decoration: underline; }
        .snippet { font-size: 14px; color: #4d5156; line-height: 1.5; }
        .snippet mark { background: none; color: #d93025; font-weight: bold; }

        /* 画像グリッド */
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .image-card { border-radius: 8px; overflow: hidden; border: 1px solid #dadce0; text-decoration: none; }
        .image-card img { width: 100%; height: 120px; object-fit: cover; }
        .image-info { padding: 8px; font-size: 12px; }

        /* モーダル */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
        .modal { background:white; padding:24px; border-radius:12px; width:90%; max-width:500px; }
        .modal-header { display:flex; justify-content:space-between; margin-bottom:15px; }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #70757a;
            background: #f2f2f2;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-content">
            <div class="logo-container">
                <a href="."><img src="logo.png" alt="シラベル"></a>
            </div>

            <div class="search-area">
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" class="search-box" placeholder="シラベルで検索" disabled>
                    <button id="searchBtn" class="search-btn" disabled>🔍</button>
                </div>
                
                <div class="home-buttons">
                    <div class="home-btn" onclick="executeSearch()">シラベル検索</div>
                    <div class="home-btn" onclick="location.href='https://github.com/hinahina1700/shiraberu/issues'">サイト登録申請</div>
                </div>
            </div>
        </div>
    </div>

    <div class="results-container">
        <div class="tabs">
            <div id="tabAll" class="tab active" onclick="switchTab('all')">すべて</div>
            <div id="tabImages" class="tab" onclick="switchTab('images')">画像</div>
        </div>
        <div id="metaInfo" class="meta-info"></div>
        <div id="results"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span id="modalSiteName" style="background:#e8f0fe; color:#1a73e8; padding:2px 8px; border-radius:4px;"></span>
                <button onclick="closeModal()" style="border:none; background:none; cursor:pointer; font-size:20px;">✕</button>
            </div>
            <h3 id="modalItemTitle" style="font-size:16px;"></h3>
            <button onclick="shareResult()" style="width:100%; padding:10px; border-radius:20px; border:1px solid #dadce0; background:white; cursor:pointer; margin-bottom:20px;">🔗 共有</button>
            <div id="modalSourceDetail" style="font-size:14px; border-top:1px solid #eee; padding-top:15px;"></div>
        </div>
    </div>

    <footer>
        &copy; shiraberu/hinahina_1700
    </footer>

    <script>
        let fuse;
        let allItems = [];
        let lastUpdatedTime = "";
        let currentTab = 'all';
        let currentSearchResults = [];

        fetch('search_index.json')
            .then(res => res.json())
            .then(data => {
                allItems = data.items || [];
                lastUpdatedTime = data.last_updated || "不明";
                fuse = new Fuse(allItems, { keys: ['title', 'content'], threshold: 0.4 });
                
                document.getElementById('searchInput').disabled = false;
                document.getElementById('searchBtn').disabled = false;

                const query = new URLSearchParams(window.location.search).get('q');
                if (query) {
                    document.getElementById('searchInput').value = query;
                    executeSearch();
                }
            });

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.body.classList.add('has-results');
            window.history.pushState({}, '', `?q=${encodeURIComponent(query)}`);

            const start = performance.now();
            currentSearchResults = fuse.search(query);
            const end = performance.now();

            document.getElementById('metaInfo').textContent = `約 ${((end - start) / 1000).toFixed(3)} 秒 （${currentSearchResults.length} 件）`;
            renderView();
        }

        document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key === 'Enter') executeSearch(); });
        document.getElementById('searchBtn').addEventListener('click', executeSearch);

        function renderView() {
            const container = document.getElementById('results');
            container.innerHTML = '';
            const query = document.getElementById('searchInput').value;

            if (currentTab === 'all') {
                container.className = '';
                currentSearchResults.forEach(r => {
                    const item = r.item;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between">
                            <div class="site-label">${item.site_name}</div>
                            <button onclick="openModal('${item.site_name}','${item.title}','${item.url}')" style="border:none;background:none;cursor:pointer;color:#70757a">⋮</button>
                        </div>
                        <h2><a href="${item.url}" target="_blank">${item.title}</a></h2>
                        <div class="snippet">${createSnippet(item.content, query)}</div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.className = 'image-grid';
                currentSearchResults.forEach(r => {
                    (r.item.images || []).forEach(img => {
                        const a = document.createElement('a');
                        a.className = 'image-card';
                        a.href = r.item.url; a.target = '_blank';
                        a.innerHTML = `<img src="${img.src}" onerror="this.parentElement.style.display='none'"><div class="image-info"><b>${r.item.title}</b><br>${r.item.site_name}</div>`;
                        container.appendChild(a);
                    });
                });
            }
        }

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tabAll').classList.toggle('active', t === 'all');
            document.getElementById('tabImages').classList.toggle('active', t === 'images');
            renderView();
        }

        function createSnippet(c, q) {
            if(!c) return "";
            const i = c.toLowerCase().indexOf(q.toLowerCase());
            const start = Math.max(0, i - 40);
            const end = Math.min(c.length, i + q.length + 80);
            let s = (start > 0 ? "..." : "") + c.substring(start, end) + (end < c.length ? "..." : "");
            return s.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>');
        }

        function openModal(s, t, u) {
            document.getElementById('modalSiteName').textContent = s;
            document.getElementById('modalItemTitle').textContent = t;
            document.getElementById('modalSourceDetail').innerHTML = `ソース: <a href="${u}" target="_blank">${u}</a><br>登録日: ${lastUpdatedTime}`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    </script>
</body>
</html>
