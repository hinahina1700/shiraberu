<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しらべる</title>
    <link rel="icon" href="logo-light.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --sub-text: #70757a;
            --border-color: #dfe1e5;
            --card-bg: #ffffff;
            --link-color: #1a0dab;
            --accent-color: #1a73e8;
            --button-bg: #f8f9fa;
            --header-border: #dadce0;
            --mark-color: #d93025;
            --footer-bg: #f2f2f2;
        }

        [data-theme="dark"] {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --sub-text: #9aa0a6;
            --border-color: #5f6368;
            --card-bg: #303134;
            --link-color: #8ab4f8;
            --accent-color: #8ab4f8;
            --button-bg: #303134;
            --header-border: #3c4043;
            --mark-color: #f28b82;
            --footer-bg: #171717;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* テーマ切り替えボタン */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 15vh;
            transition: padding-top 0.4s ease;
        }

        body.has-results .main-wrapper {
            padding-top: 20px;
            align-items: flex-start;
            border-bottom: 1px solid var(--header-border);
        }

        .header-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        body.has-results .header-content {
            flex-direction: row;
            max-width: 100%;
            align-items: center;
            gap: 20px;
        }

        .logo-container {
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .logo-container img {
            width: 200px;
            height: auto;
            transition: width 0.3s ease;
        }

        body.has-results .logo-container {
            margin-bottom: 0;
        }

        body.has-results .logo-container img {
            width: 120px;
        }

        .search-area {
            width: 100%;
            max-width: 584px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.has-results .search-area {
            max-width: 600px;
            align-items: flex-start;
        }

        .search-input-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2px 8px 2px 20px;
            box-sizing: border-box;
        }

        .search-input-wrapper:hover, .search-input-wrapper:focus-within {
            box-shadow: 0 1px 6px rgba(0,0,0,0.2);
        }

        .search-box {
            flex: 1;
            height: 44px;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 15px;
            color: var(--accent-color);
            font-size: 18px;
        }

        .home-buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        body.has-results .home-buttons {
            display: none;
        }

        .home-btn {
            background-color: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 14px;
            padding: 0 16px;
            height: 36px;
            line-height: 34px;
            cursor: pointer;
        }

        .home-btn:hover {
            border-color: var(--sub-text);
        }

        .results-container {
            width: 100%;
            max-width: 800px;
            margin-left: 160px;
            padding: 0 20px;
            box-sizing: border-box;
            display: none;
        }

        body.has-results .results-container {
            display: block;
        }

        @media (max-width: 900px) {
            body.has-results .results-container {
                margin-left: 0;
            }
            body.has-results .header-content {
                flex-direction: column;
            }
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--sub-text);
        }

        .tab {
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
        }

        .meta-info {
            font-size: 14px;
            color: var(--sub-text);
            margin: 15px 0;
        }

        .card { margin-bottom: 25px; max-width: 650px; }
        .site-label { font-size: 13px; color: var(--sub-text); margin-bottom: 4px; }
        .card h2 { margin: 0 0 4px 0; font-size: 18px; font-weight: normal; }
        .card h2 a { color: var(--link-color); text-decoration: none; }
        .card h2 a:hover { text-decoration: underline; }
        .snippet { font-size: 14px; color: var(--text-color); line-height: 1.5; opacity: 0.9; }
        .snippet mark { background: none; color: var(--mark-color); font-weight: bold; }

        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .image-card { border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); text-decoration: none; color: var(--text-color); background: var(--card-bg); }
        .image-card img { width: 100%; height: 120px; object-fit: cover; background: #eee; }
        .image-info { padding: 8px; font-size: 12px; }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; }
        .modal { background: var(--card-bg); color: var(--text-color); padding:24px; border-radius:12px; width:90%; max-width:500px; border: 1px solid var(--border-color); }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: var(--sub-text);
            background: var(--footer-bg);
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 ダーク</button>

    <div class="main-wrapper">
        <div class="header-content">
            <div class="logo-container">
                <a href="."><img id="mainLogo" src="logo-light.png" alt="しらべる"></a>
            </div>

            <div class="search-area">
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" class="search-box" placeholder="しらべるで検索..." disabled>
                    <button id="searchBtn" class="search-btn" disabled>🔍</button>
                </div>
                
                <div class="home-buttons">
                    <div class="home-btn" onclick="executeSearch()">しらべる検索</div>
                    <div class="home-btn" onclick="location.href='https://github.com/hinahina1700/shiraberu/issues'">サイト登録申請</div>
                </div>
            </div>
        </div>
    </div>

    <div class="results-container">
        <div class="tabs">
            <div id="tabAll" class="tab active" onclick="switchTab('all')">すべて</div>
            <div id="tabImages" class="tab" onclick="switchTab('images')">画像</div>
        </div>
        <div id="metaInfo" class="meta-info"></div>
        <div id="results"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <span id="modalSiteName" style="background:var(--button-bg); color:var(--accent-color); padding:2px 8px; border-radius:4px; font-size:12px;"></span>
                <button onclick="closeModal()" style="border:none; background:none; cursor:pointer; color:var(--text-color); font-size:20px;">✕</button>
            </div>
            <h3 id="modalItemTitle" style="font-size:16px; margin-top:0;"></h3>
            <button onclick="shareResult()" style="width:100%; padding:10px; border-radius:20px; border:1px solid var(--border-color); background:var(--card-bg); color:var(--text-color); cursor:pointer; margin-bottom:15px;">🔗 共有</button>
            <div id="modalSourceDetail" style="font-size:13px; border-top:1px solid var(--border-color); padding-top:12px; color:var(--sub-text);"></div>
        </div>
    </div>

    <footer>
        &copy; shiraberu/hinahina_1700
    </footer>

    <script>
        let fuse;
        let allItems = [];
        let lastUpdatedTime = "";
        let currentTab = 'all';
        let currentSearchResults = [];
        let isDarkMode = false;

        // 初期ダークモード判定（OSの設定に合わせる）
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme(true);
        }

        function toggleTheme() {
            setTheme(!isDarkMode);
        }

        function setTheme(dark) {
            isDarkMode = dark;
            document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.getElementById('themeBtn').textContent = dark ? '☀️ ライト' : '🌙 ダーク';
            updateLogo();
        }

        function updateLogo() {
            const logo = document.getElementById('mainLogo');
            if (currentTab === 'images') {
                logo.src = isDarkMode ? 'logo-img-dark.png' : 'logo-img-light.png';
            } else {
                logo.src = isDarkMode ? 'logo-dark.png' : 'logo-light.png';
            }
        }

        fetch('search_index.json')
            .then(res => res.json())
            .then(data => {
                allItems = data.items || [];
                lastUpdatedTime = data.last_updated || "不明";

                // 高精度検索（Fuse.js）の設定
                fuse = new Fuse(allItems, {
                    keys: [
                        { name: 'title', weight: 0.5 },
                        { name: 'content', weight: 0.3 },
                        { name: 'url', weight: 0.2 } // URL直接検索対応
                    ],
                    threshold: 0.3,          // より厳密かつ高精度にマッチ
                    ignoreLocation: true,    // どこにあってもヒットさせる
                    useExtendedSearch: true  // 複数単語・アンド検索・アンドNOT検索に対応
                });

                document.getElementById('searchInput').disabled = false;
                document.getElementById('searchBtn').disabled = false;

                const urlParams = new URLSearchParams(window.location.search);
                const query = urlParams.get('q');
                const tbm = urlParams.get('tbm');

                if (tbm === 'isch') currentTab = 'images';

                if (query) {
                    document.getElementById('searchInput').value = query;
                    executeSearch();
                }
            });

        function executeSearch() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) return;

            document.body.classList.add('has-results');

            // URL構造の分離 (?q=キーワード&tbm=isch)
            const params = new URLSearchParams();
            params.set('q', rawQuery);
            if (currentTab === 'images') params.set('tbm', 'isch');
            window.history.pushState({}, '', `?${params.toString()}`);

            // 複数単語（スペース区切り）対応処理
            const words = rawQuery.replace(/ /g, ' ').split(/\s+/).filter(Boolean);
            const formattedQuery = words.length > 1 ? words.map(w => `'${w}`).join(' ') : rawQuery;

            const start = performance.now();
            currentSearchResults = fuse.search(formattedQuery);
            const end = performance.now();

            document.getElementById('metaInfo').textContent = `約 ${((end - start) / 1000).toFixed(3)} 秒 （${currentSearchResults.length} 件）`;
            renderView();
        }

        document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key === 'Enter') executeSearch(); });
        document.getElementById('searchBtn').addEventListener('click', executeSearch);

        function renderView() {
            updateLogo();
            const container = document.getElementById('results');
            container.innerHTML = '';
            const query = document.getElementById('searchInput').value;

            document.getElementById('tabAll').classList.toggle('active', currentTab === 'all');
            document.getElementById('tabImages').classList.toggle('active', currentTab === 'images');

            if (currentTab === 'all') {
                container.className = '';
                if(currentSearchResults.length === 0) {
                    container.innerHTML = '<div style="color:var(--sub-text); padding: 20px 0;">一致する検索結果が見つかりませんでした。</div>';
                    return;
                }

                currentSearchResults.forEach(r => {
                    const item = r.item;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between">
                            <div class="site-label">${escapeHtml(item.site_name)}</div>
                            <button onclick="openModal('${escapeHtml(item.site_name)}','${escapeHtml(item.title)}','${escapeHtml(item.url)}')" style="border:none;background:none;cursor:pointer;color:var(--sub-text)">⋮</button>
                        </div>
                        <h2><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h2>
                        <div class="snippet">${createSnippet(item.content, query)}</div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.className = 'image-grid';
                let imgCount = 0;
                currentSearchResults.forEach(r => {
                    (r.item.images || []).forEach(img => {
                        imgCount++;
                        const a = document.createElement('a');
                        a.className = 'image-card';
                        a.href = r.item.url; a.target = '_blank'; a.rel = 'noopener';
                        a.innerHTML = `<img src="${img.src}" onerror="this.parentElement.style.display='none'"><div class="image-info"><b>${escapeHtml(r.item.title)}</b><br>${escapeHtml(r.item.site_name)}</div>`;
                        container.appendChild(a);
                    });
                });

                if(imgCount === 0) {
                    container.className = '';
                    container.innerHTML = '<div style="color:var(--sub-text); padding: 20px 0;">画像が見つかりませんでした。</div>';
                }
            }
        }

        function switchTab(t) {
            currentTab = t;
            renderView();
            const query = document.getElementById('searchInput').value.trim();
            if (query) executeSearch();
        }

        function createSnippet(c, q) {
            if(!c) return "本文なし";
            const firstWord = q.replace(/ /g, ' ').split(/\s+/)[0];
            const i = c.toLowerCase().indexOf(firstWord.toLowerCase());
            const start = Math.max(0, i - 40);
            const end = Math.min(c.length, i + firstWord.length + 80);
            let s = (start > 0 ? "..." : "") + c.substring(start, end) + (end < c.length ? "..." : "");
            return escapeHtml(s).replace(new RegExp(`(${escapeRegExp(firstWord)})`, 'gi'), '<mark>$1</mark>');
        }

        function openModal(s, t, u) {
            document.getElementById('modalSiteName').textContent = s;
            document.getElementById('modalItemTitle').textContent = t;
            document.getElementById('modalSourceDetail').innerHTML = `ソース: <a href="${u}" target="_blank" style="color:var(--link-color); word-break:break-all;">${u}</a><br>最終更新: ${lastUpdatedTime}`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function escapeHtml(str) { return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;') : ''; }
        function escapeRegExp(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    </script>
</body>
</html>
