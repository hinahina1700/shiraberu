<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しらべる - ぱわふるなけんさくエンジン</title>
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --sub-text: #70757a;
            --border-color: #dfe1e5;
            --card-bg: #ffffff;
            --link-color: #1a0dab;
            --visited-color: #681da8;
            --accent-color: #1a73e8;
            --button-bg: #f8f9fa;
            --header-border: #dadce0;
            --mark-color: #d93025;
            --footer-bg: #f2f2f2;
            --ai-bg: #f8faff;
            --ai-border: #c2e7ff;
            --user-msg-bg: #e8f0fe;
            --suggest-bg: #ffffff;
            --suggest-hover: #f1f3f4;
            --chip-bg: #f1f3f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        header {
            padding: 15px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        header a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
        }

        header a:hover { text-decoration: underline; }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 24px;
            user-select: none;
            text-align: center;
        }

        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }

        .search-box-wrapper {
            width: 100%;
            max-width: 584px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 16px;
            background: var(--bg-color);
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
            transition: box-shadow 0.2s ease;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 2px 8px rgba(32, 33, 36, 0.2);
            border-color: transparent;
        }

        .search-icon {
            color: var(--sub-text);
            margin-right: 12px;
            display: flex;
            align-items: center;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: var(--text-color);
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--sub-text);
            cursor: pointer;
            font-size: 18px;
            display: none;
            padding: 0 8px;
        }

        /* サジェスト */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--suggest-bg);
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 6px rgba(32,33,36,0.15);
            border: 1px solid var(--border-color);
            border-top: none;
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .suggestion-item:hover {
            background-color: var(--suggest-hover);
        }

        /* 検索結果画面表示時のレイアウト変更 */
        body.has-results .main-container {
            justify-content: flex-start;
            align-items: flex-start;
            padding: 20px 5%;
        }

        body.has-results .search-header-area {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        body.has-results .logo {
            font-size: 28px;
            margin-bottom: 0;
        }

        body.has-results .search-box-wrapper {
            max-width: 690px;
        }

        /* 結果コンテンツエリア */
        .results-container {
            width: 100%;
            max-width: 750px;
            display: none;
        }

        .stats-info {
            font-size: 13px;
            color: var(--sub-text);
            margin-bottom: 16px;
        }

        /* 🤖 万能AI「しらべるん」エリア */
        .ai-card {
            background: var(--ai-bg);
            border: 1px solid var(--ai-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.08);
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .ai-chat-history {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
        }

        .chat-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14.5px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .chat-bubble.ai {
            background: #ffffff;
            border: 1px solid #d2e3fc;
            color: #202124;
            align-self: flex-start;
            max-width: 90%;
        }

        .chat-bubble.user {
            background: var(--user-msg-bg);
            color: #174ea6;
            align-self: flex-end;
            max-width: 80%;
        }

        .ai-input-wrapper {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .ai-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #c2e7ff;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: #ffffff;
        }

        .ai-input:focus {
            border-color: #1a73e8;
        }

        .ai-send-btn {
            background: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .ai-send-btn:hover {
            background: #1557b0;
        }

        /* 通常検索結果カード */
        .result-item {
            margin-bottom: 24px;
        }

        .result-site-name {
            font-size: 12px;
            color: var(--sub-text);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-title {
            font-size: 18px;
            color: var(--link-color);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 14px;
            color: #4d5156;
            line-height: 1.58;
        }

        .image-preview-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .image-preview-group img {
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        footer {
            background: var(--footer-bg);
            padding: 15px 24px;
            font-size: 14px;
            color: var(--sub-text);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        /* モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-close-btn {
            margin-top: 16px;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" onclick="alert('最新インデックス読み込み中...'); location.reload();">更新</a>
        <a href="javascript:void(0)" onclick="openModal('しらべる について', '「しらべる」は検索エンジンとAIアシスタント「しらべるん」が融合した次世代検索プラットフォームです。')">概要</a>
    </header>

    <div class="main-container">
        <div class="search-header-area">
            <div class="logo">
                <span>し</span><span>ら</span><span>べ</span><span>る</span>
            </div>
            <div class="search-box-wrapper">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="検索ワードやAIへの質問・会話を入力..." autocomplete="off">
                    <button id="clearBtn" class="clear-btn">✕</button>
                </div>
                <div id="suggestionsBox" class="suggestions-box"></div>
            </div>
        </div>

        <div id="resultsContainer" class="results-container">
            <div id="statsInfo" class="stats-info"></div>

            <div id="aiCard" class="ai-card">
                <div class="ai-header">
                    <span>🤖</span>
                    <span>AIアシスタント「しらべるん」</span>
                </div>
                <div id="aiChatHistory" class="ai-chat-history">
                    <div class="chat-bubble ai" id="aiInitialBubble">
                        こんにちは！ボクは「しらべるん」だよ！<br>
                        サイトの検索はもちろん、雑談や簡単なゲーム（しりとり・クイズなど）、日常の相談なんでも気軽に話しかけてね！✨
                    </div>
                </div>
                <div class="ai-input-wrapper">
                    <input type="text" id="aiInput" class="ai-input" placeholder="しらべるんにメッセージを送る... (例: しりとりしよう！)">
                    <button id="aiSendBtn" class="ai-send-btn">送信</button>
                </div>
            </div>

            <div id="searchResultsList"></div>
        </div>
    </div>

    <footer>
        <div>© 2026 しらべる 検索プロジェクト</div>
        <div>インデックス最終更新: <span id="lastUpdatedTime">読み込み中...</span></div>
    </footer>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalTitle" class="modal-header"></div>
            <div id="modalBody" style="font-size: 14px; color: #3c4043;"></div>
            <button class="modal-close-btn" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <script>
        let searchIndexData = [];
        let fuse = null;

        // インデックスデータの読み込み
        async function loadSearchIndex() {
            try {
                const response = await fetch('search_index.json');
                if (!response.ok) throw new Error("JSON読み込み失敗");
                const data = await response.json();
                
                searchIndexData = data.items || [];
                document.getElementById('lastUpdatedTime').textContent = data.last_updated || '不明';

                fuse = new Fuse(searchIndexData, {
                    keys: ['title', 'content', 'site_name', 'ai_summary'],
                    threshold: 0.4,
                    ignoreLocation: true
                });
            } catch (e) {
                console.warn("search_index.json の読み込みに失敗しました。", e);
                document.getElementById('lastUpdatedTime').textContent = '未取得';
            }
        }

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsBox = document.getElementById('suggestionsBox');
        const aiInput = document.getElementById('aiInput');
        const aiSendBtn = document.getElementById('aiSendBtn');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';
            showSuggestions(query);
            if (query) {
                executeSearch(query);
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                suggestionsBox.style.display = 'none';
                const query = searchInput.value.trim();
                if (query) {
                    executeSearch(query);
                    talkToShiraberun(query);
                }
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.style.display = 'none';
        });

        aiSendBtn.addEventListener('click', () => {
            const msg = aiInput.value.trim();
            if (msg) {
                talkToShiraberun(msg);
                aiInput.value = '';
            }
        });

        aiInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const msg = aiInput.value.trim();
                if (msg) {
                    talkToShiraberun(msg);
                    aiInput.value = '';
                }
            }
        });

        function showSuggestions(query) {
            if (!query || !searchIndexData.length) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = searchIndexData
                .filter(item => item.title.toLowerCase().includes(query.toLowerCase()) || item.site_name.toLowerCase().includes(query.toLowerCase()))
                .slice(0, 5);

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            suggestionsBox.innerHTML = matches.map(item => `
                <div class="suggestion-item" onclick="selectSuggestion('${escapeHtml(item.title)}')">
                    <span>🔍</span>
                    <span>${escapeHtml(item.title)}</span>
                    <span style="color: var(--sub-text); font-size: 12px; margin-left: auto;">${escapeHtml(item.site_name)}</span>
                </div>
            `).join('');

            suggestionsBox.style.display = 'block';
        }

        function selectSuggestion(title) {
            searchInput.value = title;
            suggestionsBox.style.display = 'none';
            executeSearch(title);
            talkToShiraberun(title);
        }

        function executeSearch(query) {
            document.body.classList.add('has-results');
            document.getElementById('resultsContainer').style.display = 'block';

            let results = [];
            if (fuse && query) {
                results = fuse.search(query).map(r => r.item);
            } else if (query) {
                results = searchIndexData.filter(i => i.title.includes(query) || i.content.includes(query));
            }

            document.getElementById('statsInfo').textContent = `「${query}」の検索結果: 約 ${results.length} 件`;

            const resultsList = document.getElementById('searchResultsList');
            if (results.length === 0) {
                resultsList.innerHTML = `<p style="color: var(--sub-text); padding: 20px 0;">一致するWebページが見つかりませんでした。上の「しらべるん」と自由に会話してみましょう！</p>`;
                return;
            }

            resultsList.innerHTML = results.map(item => {
                const summaryText = getItemSummary(item);
                const imagesHtml = (item.images && item.images.length > 0)
                    ? `<div class="image-preview-group">
                        ${item.images.slice(0, 4).map(img => `<img src="${escapeHtml(img.src)}" alt="${escapeHtml(img.alt || '')}" onerror="this.style.display='none'">`).join('')}
                      </div>`
                    : '';

                return `
                    <div class="result-item">
                        <div class="result-site-name">
                            🌐 ${escapeHtml(item.site_name)}
                        </div>
                        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="result-title">
                            ${escapeHtml(item.title)}
                        </a>
                        <div class="result-snippet">${escapeHtml(summaryText)}</div>
                        ${imagesHtml}
                    </div>
                `;
            }).join('');
        }

        function getItemSummary(item) {
            if (item.ai_summary && item.ai_summary !== '要約データなし') {
                return item.ai_summary;
            }
            if (item.content) {
                return item.content.length > 130 ? item.content.substring(0, 130) + '...' : item.content;
            }
            return '説明はありません。';
        }

        // 🤖 万能AI「しらべるん」対話ロジック（日常会話、ゲーム、何でも対応）
        async function talkToShiraberun(userText) {
            appendChatBubble(userText, 'user');
            const loadingBubble = appendChatBubble('しらべるんが考え中...', 'ai');

            // 検索インデックスから関連しそうな情報があれば裏側で少し参考にする
            let relatedContext = '';
            if (fuse && userText) {
                const searchMatches = fuse.search(userText).slice(0, 2).map(r => r.item);
                if (searchMatches.length > 0) {
                    relatedContext = searchMatches.map(m => `【${m.title} (${m.site_name})】: ${m.ai_summary || m.content.slice(0, 100)}`).join('\n');
                }
            }

            const reply = generateUniversalReply(userText, relatedContext);

            loadingBubble.remove();
            appendChatBubble(reply, 'ai');
        }

        function appendChatBubble(text, role) {
            const historyArea = document.getElementById('aiChatHistory');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role}`;
            bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
            historyArea.appendChild(bubble);
            historyArea.scrollTop = historyArea.scrollHeight;
            return bubble;
        }

        // どんな話題にもフレキシブルに答える汎用エンジン
        function generateUniversalReply(userMsg, context) {
            const lowerMsg = userMsg.toLowerCase();

            // 1. しりとりゲームの判定
            if (lowerMsg.includes('しりとり')) {
                if (lowerMsg.endsWith('ん') || lowerMsg.endsWith('ン')) {
                    return "あ、「ん」がついちゃった！ボクの勝ちかな？また遊ぼうね！😆";
                }
                const words = ['りんご', 'ごりら', 'らっぱ', 'ぱいなっぷる', 'るびー', 'りす', 'すいか', 'かめら', 'らーめん'];
                const selected = words[Math.floor(Math.random() * words.length)];
                return `よし、しりとりしよう！じゃあボクから行くよ！\n\n「${selected}」！ 次は「${selected.slice(-1)}」から始まる言葉をどうぞ！✨`;
            }

            // 2. クイズや占いの要望
            if (lowerMsg.includes('クイズ') || lowerMsg.includes('問題')) {
                return `クイズだね！第1問：日本で一番高い山の名前はなーんだ？（簡単すぎたかな？笑）`;
            }
            if (lowerMsg.includes('おみくじ') || lowerMsg.includes('占い')) {
                const fortunes = ['大吉 🌟 今日は最高にハッピーな一日になりそう！', '中吉 ☘️ 良い発見があるかも！', '小吉 🌸 のんびりマイペースにいこう。'];
                return `運勢を占ってみたよ！\n結果は……【 ${fortunes[Math.floor(Math.random() * fortunes.length)]} 】`;
            }

            // 3. 挨拶や日常会話
            if (/^(こんにちは|こんばんは|おはよう|はじめまして|ハロー)/.test(lowerMsg)) {
                return `こんにちは！今日も話しかけてくれて嬉しいな✨ 何か面白いことあった？それとも何か調べたいことある？`;
            }
            if (lowerMsg.includes('疲れた') || lowerMsg.includes('眠い')) {
                return `今日も本当にお疲れ様！無理しないで、すこし休憩してリフレッシュしてね 🍵`;
            }

            // 4. 検索データに関連する質問がある場合
            if (context) {
                return `「${userMsg}」について調べてみたら、こんな情報が見つかったよ！\n\n${context}\n\nもっと詳しく知りたかったら、下の検索結果リンクも覗いてみてね！`;
            }

            // 5. その他、どんなメッセージにも柔軟にリアクション
            return `「${userMsg}」かぁ、なるほどね！\nボクは日常の雑談や軽いゲーム、ちょっとした相談まで何でもお話しできるから、気軽にどんどん話しかけてね！`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = text;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', loadSearchIndex);
    </script>
</body>
</html>
