name: Shiraberu Scraper & AI Summarizer

on:
  schedule:
    # 毎日午前0時(UTC) / 日本時間 午前9時に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHubの画面から手動で実行できるようにする

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリとChromiumのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright google-genai
          playwright install chromium --with-deps

      - name: スクレイパーとGemini AI要約の実行
        env:
          # GitHub Secrets から安全にAPIキーを読み込む
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper.py

      - name: 更新された search_index.json をコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: search_index.json を自動更新 (AI要約付き)" && git push)
