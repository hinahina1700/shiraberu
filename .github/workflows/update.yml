name: Update Search Index

on:
  schedule:
    # 3日に1回、日本時間の午前3時（UTC 18時）に自動実行
    - cron: '0 18 */3 * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Python環境のセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 依存ライブラリとPlaywrightのインストール
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 playwright
        playwright install chromium
        playwright install-deps

    - name: スクレイピングの実行
      run: |
        python scraper.py

    - name: 変更があった場合に自動コミット＆プッシュ
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add search_index.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update search index" && git push)
